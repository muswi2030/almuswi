<!doctype html>
<html dir="rtl" lang="ar">
<head>

<title>السوق العصري</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Tahoma}
.top{background:#c9a96e;color:#fff;text-align:center;padding:8px;font-size:11px}
header{padding:12px;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#fff;z-index:20}
.logo{color:#c9a96e;font-weight:900;font-size:18px}
#q{flex:1;padding:11px;border:1px solid #ddd;border-radius:22px}
.btn-add{background:#111;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:900}
#admin{display:none;background:#fffbe6;padding:14px;margin:12px;border:2px dashed #c9a96e;border-radius:12px}
#admin input,#admin select{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
.pick{background:#c9a96e;color:#fff;padding:12px;border-radius:8px;text-align:center;display:block;cursor:pointer;font-weight:900}
#pv{display:none;width:100%;max-height:200px;border-radius:10px;margin-top:8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.cat{border:2px solid #e8dcc6;background:#faf7f2;border-radius:14px;padding:10px;text-align:center}
.cat.active{background:#111;color:#c9a96e}
.cat b{font-size:24px;display:block}.cat span{font-size:11px;font-weight:800;display:block;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{border:1px solid #eee;border-radius:12px;overflow:hidden}
.ph{height:100px;background:#f6f3ef;display:grid;place-items:center;font-size:30px}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:8px;font-size:11px}.info b{color:#c9a96e;display:block;margin:4px 0}
.info button{width:100%;background:#111;color:#fff;border:0;padding:7px;border-radius:6px}
#cart{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:#fff;padding:12px;border-radius:14px;display:flex;justify-content:space-between;z-index:99}
</style>
</head>

<button class="btn-add" onclick="openAdmin()">+ منتج</button>

<label class="pick" for="fi">📸 اختر صورة المنتج</label><input id="fi" type="file" accept="image/*" style="display:none"><img id="pv">
<button onclick="save()" style="width:100%;background:#c9a96e;color:#fff;border:0;padding:12px;border-radius:8px;font-weight:900;margin-top:8px">حفظ ✓</button>
<button onclick="closeAdmin();clearAll()" style="width:100%;background:#ffdddd;color:#900;border:0;padding:8px;border-radius:8px;margin-top:6px">مسح كل المنتجات المضافة (اذا ضرب)</button>
<button onclick="closeAdmin()" style="width:100%;background:#eee;border:0;padding:8px;border-radius:8px;margin-top:4px">اغلاق</button>
