<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق العصري</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#f5f5f5}
header{display:flex;gap:10px;align-items:center;padding:12px 10px;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #eee}
.logo{color:#c9a96e;font-weight:900;font-size:17px;line-height:1.1;white-space:nowrap}
#q{flex:1;padding:12px 16px;border:1.5px solid #e8dcc6;border-radius:25px;outline:none}
.btn{display:none;background:#c9a96e;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:900}
.btn.show{display:block}
#cartTop{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e8dcc6;padding:10px 18px;border-radius:30px;cursor:pointer;min-width:85px;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
#admin{display:none;background:#fff;padding:12px;margin:10px;border:2px solid #c9a96e;border-radius:12px}
#admin input,#admin select{width:100%;padding:11px;margin:4px 0;border:1px solid #ddd;border-radius:8px}
.pick{background:#111;color:#c9a96e;padding:11px;border-radius:8px;text-align:center;display:block;font-weight:900;border:2px dashed #c9a96e}
#pvBox{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cats{display:flex;gap:10px;padding:10px;overflow-x:auto}
.cat-pill{background:#fff;border:1.5px solid #eee;padding:5px 14px 5px 6px;border-radius:25px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;gap:7px;white-space:nowrap}
.cat-pill.active{background:#111;color:#fff;border-color:#111}
.cat-pill img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#f9f9f9;border:1px solid #eee}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:170px;background:#f9f9f9}.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:10px;display:flex;flex-direction:column;flex:1}
.info h4{margin:0;font-size:12px;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.short{font-size:11px;color:#888;margin:4px 0;height:30px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.info b{color:#c9a96e;font-size:14px;margin:5px 0}
.info button{width:100%;border:0;padding:10px;border-radius:10px;font-weight:900;margin-top:4px;cursor:pointer}
.btn-add{background:#111;color:#fff}.btn-edit{background:#f0e6d3}.btn-del{background:#ff3b3b;color:#fff;font-size:11px}
footer{margin:15px 10px;background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border:1.5px solid #e8dcc6;border-radius:20px;padding:15px;text-align:center}
#cartPage{display:none;position:fixed;inset:0;background:#f5f5f5;z-index:100;overflow-y:auto}
#cartPage.show{display:block}
.cartItem{display:flex;gap:10px;background:#fff;padding:10px;margin:8px 10px;border-radius:12px;align-items:center}
.cartItem img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.qtyBtn{border:1.5px solid #eee;background:#fff;width:28px;height:28px;border-radius:50%;font-weight:900}
.delItem{background:#ff3b3b;color:#fff;border:0;padding:6px 10px;border-radius:8px;font-size:11px}
</style>
</head>
<body>
<header>
  <div id="cartTop" onclick="openCart()"><span style="font-size:22px">🛒</span><span id="cnt" style="font-weight:900;font-size:18px">0</span></div>
  <input id="q" placeholder="ابحث..." oninput="render()">
  <div class="logo" id="logoBtn">السوق<br>العصري</div>
  <button class="btn" id="addBtn">+ منتج</button>
</header>

<div id="admin">
<select id="fc"><option>ساعات</option><option>مستلزمات أطفال</option><option>مواد غذائية</option><option>العناية بالبشرة</option><option>مستلزمات منزلية</option><option>إلكترونيات</option><option>أزياء</option><option>عطور</option><option>حقائب وأحذية</option><option>اكسسوارات موبايل</option></select>
<input id="fn" placeholder="اسم المنتج"><input id="fd" placeholder="وصف قصير"><input id="fp" type="number" placeholder="السعر">
<label class="pick" for="fi">📸 اختار صور</label><input id="fi" type="file" accept="image/*" multiple style="display:none"><div id="pvBox"></div>
<button onclick="saveProduct()" id="saveBtn" style="width:100%;background:#c9a96e;color:#fff;border:0;padding:12px;border-radius:8px;font-weight:900;margin-top:8px">نشر ✓</button>
<button onclick="closeAdmin()" style="width:100%;background:#eee;border:0;padding:8px;border-radius:8px;margin-top:6px">اغلاق</button>
</div>

<div class="cats" id="cats"></div><div class="grid" id="grid"></div>

<footer>
  <div style="display:flex;gap:8px;justify-content:center;margin-bottom:8px">
    <button onclick="openPage('about')" style="background:#111;color:#fff;border:0;padding:8px 16px;border-radius:20px;font-weight:700">من نحن</button>
    <button onclick="openPage('contact')" style="background:#fff;border:1.5px solid #111;padding:8px 16px;border-radius:20px;font-weight:700">اتصل بنا</button>
  </div>
  <div style="font-size:11px;color:#888">© 2026 السوق العصري</div>
</footer>

<div id="cartPage">
  <div style="background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee">
    <button onclick="closeCart()" style="background:#111;color:#fff;border:0;width:35px;height:35px;border-radius:50%">✕</button>
    <h3 style="margin:0">سلة التسوق 🛒</h3><span id="cartCount2" style="font-weight:900;color:#c9a96e">0 منتج</span>
  </div>
  <div id="cartList"></div><div id="emptyCart" style="text-align:center;padding:50px 20px;color:#999;display:none">السلة فارغة</div>
  <div id="cartFooter" style="background:#fff;margin:10px;border-radius:16px;padding:15px;border:1.5px solid #e8dcc6;display:none">
    <div style="display:flex;justify-content:space-between;font-weight:900;margin-bottom:12px"><span>المجموع:</span><span id="tot" style="color:#c9a96e">0 د.ع</span></div>
    <input id="custName" placeholder="اسمك" style="width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-bottom:8px">
    <input id="custPhone" placeholder="رقم هاتفك" style="width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-bottom:8px">
    <input id="custAddr" placeholder="العنوان" style="width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-bottom:12px">
    <button onclick="orderNow()" style="width:100%;background:#25D366;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:900;font-size:16px">إرسال الطلب عبر واتساب ✓</button>
  </div>
</div>

<div id="pageModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;padding:15px" onclick="this.style.display='none'"><div style="background:#fff;width:100%;max-width:400px;border-radius:16px;padding:20px" onclick="event.stopPropagation()"><h3 id="pageTitle"></h3><div id="pageContent" style="margin-top:10px;line-height:1.7"></div><button onclick="pageModal.style.display='none'" style="margin-top:12px;width:100%;background:#111;color:#fff;border:0;padding:10px;border-radius:8px">اغلاق</button></div></div>

<script>
const SECRET="2223",WA_NUMBER="9647822642223";
// صور حقيقية لكل قسم
let CATS_DATA=[
  {n:"الكل", img:"https://cdn-icons-png.flaticon.com/512/3081/3081559.png"},
  {n:"ساعات", img:"./watch.jpg"},
  {n:"مستلزمات أطفال", img:"https://cdn-icons-png.flaticon.com/512/3082/3082067.png"},
  {n:"مواد غذائية", img:"https://images.unsplash.com/photo-1542838132-92c53300491e?w=100&h=100&fit=crop"},
  {n:"العناية بالبشرة", img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=100&h=100&fit=crop"},
  {n:"مستلزمات منزلية", img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=100&h=100&fit=crop"},
  {n:"إلكترونيات", img:"https://images.unsplash.com/photo-1498049794561-7780e7231666?w=100&h=100&fit=crop"},
  {n:"أزياء", img:"https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=100&h=100&fit=crop"},
  {n:"عطور", img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=100&h=100&fit=crop"},
  {n:"حقائب وأحذية", img:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=100&h=100&fit=crop"},
  {n:"اكسسوارات موبايل", img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=100&h=100&fit=crop"}
];
let CATS=CATS_DATA.map(x=>x.n);
let custom=[],active="الكل",cart=[],tmpImgs=[],editingIndex=-1;
try{custom=JSON.parse(localStorage.getItem('hasry_final_v2')||'[]')}catch(e){custom=[]}
try{cart=JSON.parse(localStorage.getItem('hasry_cart')||'[]')}catch(e){cart=[]}
logoBtn.onclick=()=>{let c=(logoBtn._c||0)+1;logoBtn._c=c;setTimeout(()=>logoBtn._c=0,2000);if(c>=5)askCode();};
addBtn.onclick=()=>askCode();
if(location.search.includes('admin='+SECRET))addBtn.classList.add('show');
function askCode(){let c=prompt("رمز الامان:");if(c===SECRET){addBtn.classList.add('show');admin.style.display='block';render();}}
function closeAdmin(){admin.style.display='none';editingIndex=-1;saveBtn.innerText='نشر ✓';fn.value='';fd.value='';fp.value='';tmpImgs=[];pvBox.innerHTML='';}
let catsEl=document.getElementById('cats');
CATS_DATA.forEach(obj=>{
  let d=document.createElement('div');
  d.className='cat-pill'+(obj.n===active?' active':'');
  d.innerHTML=`<img src="${obj.img}"> ${obj.n}`;
  d.onclick=()=>{active=obj.n;document.querySelectorAll('.cat-pill').forEach(x=>x.classList.remove('active'));d.classList.add('active');render();};
  catsEl.appendChild(d);
});
fi.addEventListener('change',e=>{tmpImgs=[];pvBox.innerHTML='';Array.from(e.target.files).slice(0,4).forEach(f=>{let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),max=800,w=img.width,h=img.height;if(w>max||h>max){if(w>h){h*=max/w;w=max}else{w*=max/h;h=max}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let d=c.toDataURL('image/jpeg',0.7);tmpImgs.push(d);let th=document.createElement('img');th.src=d;th.style.cssText='width:55px;height:55px;object-fit:cover;border-radius:8px;border:1px solid #c9a96e';pvBox.appendChild(th);};img.src=ev.target.result;};r.readAsDataURL(f);});});
function render(){let list=[...custom];if(active!=="الكل")list=list.filter(x=>x.c===active);let q=document.getElementById('q').value.trim();if(q)list=list.filter(x=>x.n.includes(q));let isAdmin=addBtn.classList.contains('show');grid.innerHTML=list.map(p=>{let first=p.imgs?p.imgs[0]:p.img;let real=custom.indexOf(p);return `<div class="card"><div class="ph"><img src="${first}"></div><div class="info"><h4>${p.n}</h4><div class="short">${(p.short||'').substring(0,50)}</div><b>${p.p.toLocaleString()} د.ع</b><button class="btn-add" onclick="addToCart('${p.n.replace(/'/g,'')}',${p.p},'${first}')">أضف للسلة</button>${isAdmin?`<button class="btn-edit" onclick="editProduct(${real})">تعديل ✏️</button><button class="btn-del" onclick="deleteProduct(${real})">حذف ✕</button>`:''}</div></div>`}).join('');updateCartUI();}
function saveProduct(){let c=fc.value,n=fn.value.trim(),d=fd.value.trim().substring(0,50),p=parseInt(fp.value);if(!n||!p)return alert('اكتب الاسم والسعر');if(editingIndex==-1&&!tmpImgs.length)return alert('اختار صورة');if(editingIndex>=0){custom[editingIndex].c=c;custom[editingIndex].n=n;custom[editingIndex].short=d;custom[editingIndex].p=p;if(tmpImgs.length){custom[editingIndex].imgs=tmpImgs;custom[editingIndex].img=tmpImgs[0];}}else custom.push({c,n,p,short:d,imgs:tmpImgs,img:tmpImgs[0]});localStorage.setItem('hasry_final_v2',JSON.stringify(custom));render();alert(editingIndex>=0?'تم التعديل ✓':'تم النشر ✓');closeAdmin();}
function deleteProduct(i){if(!confirm('تحذف '+custom[i].n+' ؟'))return;custom.splice(i,1);localStorage.setItem('hasry_final_v2',JSON.stringify(custom));render();}
function editProduct(i){let p=custom[i];editingIndex=i;fc.value=p.c;fn.value=p.n;fd.value=p.short||'';fp.value=p.p;admin.style.display='block';saveBtn.innerText='حفظ التعديل ✓';scrollTo(0,0);}
function addToCart(n,p,img){let ex=cart.find(x=>x.n===n);if(ex)ex.qty++;else cart.push({n,p,img,qty:1});saveCart();render();openCart();}
function saveCart(){localStorage.setItem('hasry_cart',JSON.stringify(cart));}
function updateCartUI(){let total=0,count=0;cart.forEach(x=>{total+=x.p*x.qty;count+=x.qty;});cnt.innerText=count;if(cartCount2)cartCount2.innerText=count+' منتج';if(tot)tot.innerText=total.toLocaleString()+' د.ع';}
function openCart(){cartPage.classList.add('show');renderCartItems();}
function closeCart(){cartPage.classList.remove('show');}
function renderCartItems(){let list=document.getElementById('cartList');let empty=document.getElementById('emptyCart');let foot=document.getElementById('cartFooter');if(cart.length===0){list.innerHTML='';empty.style.display='block';foot.style.display='none';return;}empty.style.display='none';foot.style.display='block';list.innerHTML=cart.map((x,i)=>`<div class="cartItem"><img src="${x.img}"><div class="cartItemInfo" style="flex:1"><h5 style="margin:0;font-size:12px">${x.n}</h5><b style="color:#c9a96e">${x.p.toLocaleString()} د.ع</b><div style="margin-top:6px;display:flex;gap:6px;align-items:center"><button class="qtyBtn" onclick="changeQty(${i},-1)">-</button><span style="font-weight:900">${x.qty}</span><button class="qtyBtn" onclick="changeQty(${i},1)">+</button></div></div><button class="delItem" onclick="removeItem(${i})">حذف</button></div>`).join('');updateCartUI();}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);saveCart();renderCartItems();updateCartUI();}
function removeItem(i){cart.splice(i,1);saveCart();renderCartItems();updateCartUI();}
function orderNow(){if(cart.length===0)return alert('السلة فارغة');let name=custName.value.trim(),phone=custPhone.value.trim(),addr=custAddr.value.trim();if(!name||!phone)return alert('اكتب اسمك ورقمك');let total=0,msg=`طلب جديد من السوق العصري%0A%0A`;cart.forEach(x=>{msg+=`${x.n} × ${x.qty} = ${(x.p*x.qty).toLocaleString()} د.ع%0A`;total+=x.p*x.qty;});msg+=`%0Aالمجموع: ${total.toLocaleString()} د.ع%0Aالاسم: ${name}%0Aالهاتف: ${phone}%0Aالعنوان: ${addr}`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
function openPage(type){let m=pageModal,t=pageTitle,c=pageContent;if(type==='about'){t.innerText='من نحن';c.innerHTML='السوق العصري متجر عراقي يوفر منتجات أصلية بأسعار مناسبة وتوصيل لكل العراق.';}if(type==='contact'){t.innerText='اتصل بنا';c.innerHTML='واتساب: 07822642223<br><a href="https://wa.me/9647822642223" style="display:block;background:#25D366;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none;margin-top:10px;font-weight:900">راسلنا واتساب</a>';}m.style.display='flex';}
render();
</script>
</body>
  </html>
