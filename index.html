<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق العصري</title>
<style>
body{margin:0;font-family:Tahoma;background:#fff}
.top{background:#c9a96e;color:#fff;text-align:center;padding:8px;font-size:12px}
header{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee}
.logo{color:#c9a96e;font-weight:900;font-size:18px}
#q{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.cat{background:#faf7f2;border:2px solid #e8dcc6;border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.cat.active{background:#111;color:#c9a96e;border-color:#111}
.cat b{font-size:24px;display:block}
.cat span{font-size:11px;font-weight:800;display:block;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{border:1px solid #eee;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:8px}
.ph{height:100px;background:#f6f3ef;display:grid;place-items:center;font-size:36px}
.card b{color:#c9a96e;display:block;margin:4px}
.card button{background:#111;color:#fff;border:0;padding:6px 12px;border-radius:6px;width:90%;margin-top:4px}
</style>
</head>
<body>
<div class="top">السوق العصري • توصيل مجاني فوق 500 ألف</div>
<header>
<div class="logo">السوق العصري</div>
<input id="q" placeholder="ابحث..." oninput="render()">
</header>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>

<script>
const CATS=[
{n:"الكل",i:"✨"},
{n:"ساعات",i:"⌚"},
{n:"مستلزمات أطفال",i:"👶"},
{n:"مواد غذائية",i:"🥑"},
{n:"العناية بالبشرة",i:"💧"},
{n:"مستلزمات منزلية",i:"🏺"},
{n:"إلكترونيات",i:"🎧"},
{n:"أزياء",i:"👗"},
{n:"عطور",i:"🌸"},
{n:"حقائب وأحذية",i:"👜"},
{n:"اكسسوارات موبايل",i:"📱"}
];
const PRODUCTS=[
{c:"ساعات",n:"ساعة فاخرة",p:450000,i:"⌚"},
{c:"مستلزمات أطفال",n:"طقم كاشمير للأطفال",p:85000,i:"👶"},
{c:"مواد غذائية",n:"سلة غذاء عضوي",p:60000,i:"🥑"},
{c:"العناية بالبشرة",n:"سيروم ذهبي",p:75000,i:"💧"},
{c:"مستلزمات منزلية",n:"مبخرة فاخرة",p:45000,i:"🏺"},
{c:"إلكترونيات",n:"سماعات فاخرة",p:350000,i:"🎧"},
{c:"أزياء",n:"ملابس عصرية",p:95000,i:"👗"},
{c:"عطور",n:"عطر فاخر",p:120000,i:"🌸"},
{c:"حقائب وأحذية",n:"حقيبة فاخرة",p:180000,i:"👜"},
{c:"اكسسوارات موبايل",n:"اكسسوار موبايل",p:25000,i:"📱"}
];
let active="الكل";
const catsEl=document.getElementById('cats');
const gridEl=document.getElementById('grid');
CATS.forEach(o=>{
let d=document.createElement('div');
d.className='cat'+(o.n===active?' active':'');
d.innerHTML=`<b>${o.i}</b><span>${o.n}</span>`;
d.onclick=()=>{
active=o.n;
document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
d.classList.add('active');
render();
};
catsEl.appendChild(d);
});
function render(){
let q=document.getElementById('q').value||"";
let list=PRODUCTS.filter(p=>{
if(active!=="الكل" && p.c!==active) return false;
if(q && !p.n.includes(q)) return false;
return true;
});
gridEl.innerHTML=list.map(p=>`
<div class="card">
<div class="ph">${p.i}</div>
<div>${p.n}</div>
<b>${p.p.toLocaleString()} د.ع</b>
<button>أضف للسلة</button>
</div>
`).join('');
}
render();
</script>
</body>
</html>
