<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق الحصري | Hasry Market</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf9f3;font-family:Tahoma;color:#222;overflow-x:hidden}
header{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px #0001}
.logo{font-weight:900;font-size:18px;white-space:nowrap}.logo span{color:#c89b00}
.search{flex:1;display:flex;background:#f2ece0;border-radius:12px;overflow:hidden;border:1px solid #e8dfc6}
.search input{flex:1;border:0;background:transparent;padding:10px 12px;outline:0;font-size:13px}
.hbtn{background:#111;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:900;font-size:12px}
.wrap{max-width:1100px;margin:auto;padding:12px}
.banner{background:linear-gradient(135deg,#111,#3a2e00);color:#fff;border-radius:18px;padding:18px;text-align:center}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
@media(max-width:700px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px #0001}
.cat.active{border-color:#d4a017;background:#fff8e1}
.cat.ic{font-size:26px}.cat h3{font-size:11px;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee;box-shadow:0 2px 10px #0000000d}
.card.ph{height:140px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#fdf6d8,#f0e0a0)}
.card img{width:100%;height:140px;object-fit:cover;display:block}
.info{padding:10px}.info h4{font-size:12px;margin:0;line-height:1.4;height:34px;overflow:hidden}
.info small{color:#888;font-size:10px}.info b{color:#a67c00;display:block;margin:6px 0;font-size:14px}
.info button{width:100%;background:#111;color:#fff;border:0;padding:9px;border-radius:10px;font-weight:900}
#admin{background:#fff;padding:14px;border-radius:16px;border:2px dashed #d4a017;display:none;margin-bottom:14px}
#admin input,#admin select,#admin textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:13px}
#admin.sv{background:#d4a017;border:0;padding:12px;border-radius:10px;width:100%;font-weight:900}
#cart{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:#fff;padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;z-index:99;max-width:500px;margin:auto}
#cart button{background:#25D366;color:#fff;border:0;padding:8px 14px;border-radius:10px;font-weight:900}
/* حماية نهائية ضد شعار netlify */
a[href*="netlify"], div[class*="netlify"], iframe[src*="netlify"]{display:none!important;opacity:0!important;pointer-events:none!important}
</style>
</head>
<body>
<header>
<div class="logo">السوق <span>الحصري</span></div>
<div class="search"><input id="q" placeholder="دور على منتج..." oninput="render()"></div>
<button class="hbtn" onclick="toggleAdmin()">+ منتج</button>
</header>
<div class="wrap">
<div class="banner"><b>توصيل لكل العراق - الدفع عند الاستلام</b><br><small>اطلب الآن على واتساب 07822642223</small></div>
<div id="admin">
<h3 style="margin:0 0 8px">اضافة منتج جديد بصورة</h3>
<select id="f_cat"><option>ساعات</option><option>مستلزمات أطفال</option><option>مواد غذائية</option><option>العناية بالبشرة</option><option>مستلزمات منزلية</option><option>إلكترونيات</option><option>أزياء</option><option>عطور</option><option>حقائب وأحذية</option><option>اكسسوارات موبايل</option></select>
<input id="f_name" placeholder="اسم المنتج">
<input id="f_price" type="number" placeholder="السعر مثلا 45000">
<textarea id="f_desc" placeholder="وصف قصير"></textarea>
<input id="f_img" type="file" accept="image/*">
<img id="prev" style="width:100%;display:none;border-radius:12px;margin-top:6px;max-height:180px;object-fit:cover">
<button class="sv" onclick="save()">حفظ ونشر بالموقع ✓</button>
<button onclick="this.parentElement.style.display='none'" style="width:100%;background:#eee;border:0;padding:10px;border-radius:10px;margin-top:6px">اغلاق</button>
</div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div style="height:80px"></div>
</div>
<div id="cart"><div>🛒 <span id="cnt">0</span> منتج | <span id="tot">0</span> د.ع</div><button onclick="order()">واتساب</button></div>
<script>
const CATS_INFO=[ {n:"الكل",ic:"🛍️"},{n:"ساعات",ic:"⌚"},{n:"مستلزمات أطفال",ic:"👶"},{n:"مواد غذائية",ic:"🛒"},{n:"العناية بالبشرة",ic:"✨"},{n:"مستلزمات منزلية",ic:"🏠"},{n:"إلكترونيات",ic:"🎧"},{n:"أزياء",ic:"👕"},{n:"عطور",ic:"🌸"},{n:"حقائب وأحذية",ic:"👜"},{n:"اكسسوارات موبايل",ic:"📱"} ];
const DEF=[ {c:"ساعات",n:"ساعة كاسيو ذهبية رجالية",p:45000,d:"أصلية - ضد الماء",ic:"⌚"}, {c:"مستلزمات أطفال",n:"طقم اطفال 3 قطع قطن",p:25000,d:"ناعم وطبيعي",ic:"👶"}, {c:"مواد غذائية",n:"سلة غذائية عائلية",p:60000,d:"متكاملة",ic:"🛒"}, {c:"العناية بالبشرة",n:"سيروم فيتامين C للبشرة",p:30000,d:"نضارة وتفتيح",ic:"✨"}, {c:"عطور",n:"عطر عود ملكي ثابت",p:45000,d:"24 ساعة ثبات",ic:"🌸"}, {c:"إلكترونيات",n:"سماعة بلوتوث JBL",p:75000,d:"صوت نقي - شحن سريع",ic:"🎧"} ];
let custom=JSON.parse(localStorage.getItem('hasry_final')||'[]');
let active="الكل",cart=[],sum=0,tmpImg="";
const catsEl=document.getElementById('cats');
CATS_INFO.forEach(o=>{ let d=document.createElement('div');d.className='cat'+(o.n==active?' active':''); d.innerHTML=`<div class="ic">${o.ic}</div><h3>${o.n}</h3>`; d.onclick=()=>{active=o.n;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));d.classList.add('active');render()}; catsEl.appendChild(d); });
document.getElementById('f_img').addEventListener('change',e=>{ let f=e.target.files[0];if(!f) return; let r=new FileReader();r.onload=ev=>{tmpImg=ev.target.result;let p=document.getElementById('prev');p.src=tmpImg;p.style.display='block';};r.readAsDataURL(f); });
function getAll(){return [...DEF,...custom]}
function render(){ let list=getAll(); if(active!="الكل") list=list.filter(x=>x.c==active); let q=document.getElementById('q').value.trim(); if(q) list=list.filter(x=>x.n.includes(q)); document.getElementById('grid').innerHTML=list.map(p=>{ let imgPart=p.i?`<img src="${p.i}">`:`<div class="ph">${p.ic||'🛍️'}</div>`; return `<div class="card">${imgPart}<div class="info"><h4>${p.n}</h4><small>${p.d||''}</small><b>${p.p.toLocaleString()} د.ع</b><button onclick="add(${p.p},'${p.n.replace(/'/g,'')}')">اضف للسلة</button></div></div>`; }).join('')||'<p style="grid-column:1/-1;text-align:center;color:#888">ماكو منتجات بهذا القسم</p>'; }
function toggleAdmin(){let a=document.getElementById('admin');a.style.display=a.style.display=='none'?'block':'none';}
function save(){ let c=document.getElementById('f_cat').value,n=document.getElementById('f_name').value.trim(),p=parseInt(document.getElementById('f_price').value),d=document.getElementById('f_desc').value.trim(); if(!n||!p){return alert('اكتب الاسم والسعر');} custom.push({c,n,p,d,i:tmpImg,ic:'🛍️'});localStorage.setItem('hasry_final',JSON.stringify(custom));render();alert('تم النشر بنجاح ✓');toggleAdmin();document.getElementById('f_name').value='';document.getElementById('f_price').value='';tmpImg='';document.getElementById('prev').style.display='none'; }
function add(p,n){cart.push({n,p});sum+=p;document.getElementById('cnt').innerText=cart.length;document.getElementById('tot').innerText=sum.toLocaleString();}
function order(){if(!cart.length) return alert('السلة فارغة');let t=cart.map(c=>c.n+' - '+c.p).join('%0A');window.open('https://wa.me/9647822642223?text=طلب جديد:%0A'+t+'%0Aالمجموع:'+sum,'_blank');}
render();
</script>
</body>
</html>
