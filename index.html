<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق العصري</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Tahoma;color:#111}
.top{background:#c9a96e;color:#fff;text-align:center;padding:8px;font-size:11px}
header{padding:12px;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#fff;z-index:20}
.logo{color:#c9a96e;font-weight:900;font-size:20px}
#q{flex:1;padding:11px 14px;border:1px solid #ddd;border-radius:22px;outline:0}
.btn-add{background:#111;color:#fff;border:0;padding:11px 16px;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer}
#admin{display:none;background:#fffbe6;padding:16px;margin:12px;border:2px dashed #c9a96e;border-radius:14px;max-width:600px;margin:12px auto}
#admin input,#admin select,#admin textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:10px;font-size:13px}
.pick{ background:#c9a96e;color:#fff;padding:13px;border-radius:10px;text-align:center;display:block;cursor:pointer;font-weight:900;margin:8px 0}
#pv{display:none;width:100%;max-height:220px;border-radius:12px;object-fit:cover;margin-top:8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;max-width:900px;margin:auto}
.cat{border:2px solid #e8dcc6;background:#faf7f2;border-radius:16px;padding:12px 4px;text-align:center;cursor:pointer}
.cat.active{background:#111;color:#c9a96e;border-color:#111;transform:scale(1.05)}
.cat b{font-size:26px;display:block}.cat span{font-size:11px;font-weight:800;display:block;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:900px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.cats{grid-template-columns:repeat(5,1fr)}}
.card{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff}
.ph{height:110px;background:#f6f3ef;display:grid;place-items:center;font-size:32px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:9px}.info h4{font-size:11px;margin:0;min-height:28px;line-height:1.3}
.info b{color:#c9a96e;display:block;margin:5px 0;font-size:13px}
.info button{width:100%;background:#111;color:#fff;border:0;padding:8px;border-radius:8px;font-weight:900;cursor:pointer}
#cart{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:#fff;padding:12px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;max-width:500px;margin:0 auto;z-index:99}
</style>
</head>
<body>
<div class="top">السوق العصري • توصيل مجاني فوق 500 ألف • دفع عند الاستلام</div>
<header>
<div class="logo">السوق العصري</div>
<input id="q" placeholder="ابحث في السوق العصري..." oninput="render()">
<button class="btn-add" onclick="openAdmin()">+ منتج</button>
</header>

<div id="admin">
<h3 style="margin:0 0 10px;color:#c9a96e">إضافة منتج جديد - السوق العصري</h3>
<select id="fc">
<option>ساعات</option>
<option>مستلزمات أطفال</option>
<option>مواد غذائية</option>
<option>العناية بالبشرة</option>
<option>مستلزمات منزلية</option>
<option>إلكترونيات</option>
<option>أزياء</option>
<option>عطور</option>
<option>حقائب وأحذية</option>
<option>اكسسوارات موبايل</option>
</select>
<input id="fn" placeholder="اسم المنتج">
<input id="fp" type="number" placeholder="السعر بالدينار العراقي">
<textarea id="fd" placeholder="وصف المنتج (اختياري)"></textarea>
<label class="pick" for="fi">📸 اضغط هنا لاختيار صورة المنتج</label>
<input id="fi" type="file" accept="image/*" style="display:none">
<img id="pv">
<button onclick="save()" style="width:100%;background:#c9a96e;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer">حفظ المنتج ✓</button>
<button onclick="closeAdmin()" style="width:100%;background:#eee;color:#333;border:0;padding:10px;border-radius:10px;margin-top:6px;cursor:pointer">إغلاق</button>
</div>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div style="height:90px"></div>
