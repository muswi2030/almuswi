<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق العصري</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma;background:#fff}
.top{background:#111;color:#c9a96e;text-align:center;padding:10px;font-weight:900}
header{padding:12px;display:flex;gap:8px;align-items:center;background:#fff;position:sticky;top:0;z-index:10;border-bottom:2px solid #c9a96e}
.logo{color:#c9a96e;font-weight:900;font-size:20px}
#q{flex:1;padding:12px;border:2px solid #e8dcc6;border-radius:22px}
.btn{background:#c9a96e;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:900;cursor:pointer;display:none}
.btn.show{display:block}
#admin{display:none;background:#fffbe6;padding:14px;margin:12px;border:2px solid #c9a96e;border-radius:14px}
#admin input,#admin select{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
.pick{background:#111;color:#c9a96e;padding:12px;border-radius:8px;text-align:center;display:block;font-weight:900;border:2px dashed #c9a96e;cursor:pointer}
#pvBox{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.cat{background:#fff;border:2px solid #e8dcc6;border-radius:16px;overflow:hidden;text-align:center;cursor:pointer}
.cat.active{border-color:#111;outline:2px solid #111}
.cat img{width:100%;height:75px;object-fit:cover;display:block}
.cat span{font-size:11px;font-weight:900;display:block;padding:7px;background:#faf7f2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;text-align:center}
.ph{height:135px;background:#f6f3ef;overflow:hidden;cursor:zoom-in;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:8px}.info h4{margin:4px 0;font-size:12px;height:32px;overflow:hidden}
.info b{color:#c9a96e;display:block}
.info button{width:92%;background:#111;color:#fff;border:0;padding:8px;border-radius:8px;margin-top:4px;font-weight:900}
#cart{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:#fff;padding:12px 16px;border-radius:50px;display:flex;justify-content:space-between;align-items:center;z-index:99}
.wa-btn{background:#fff;border:0;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;align-items:center;justify-content:center;flex-direction:column}
#lightbox.show{display:flex}
#lightImg{max-width:92%;max-height:75%;border-radius:14px;transition:.3s;transform:scale(.8)}
#lightbox.show #lightImg{transform:scale(1)}
#lightThumbs{display:flex;gap:8px;margin-top:14px}
#lightThumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid transparent}
#lightThumbs img.active{border-color:#c9a96e}
</style>
</head>
<body>
<div class="top">السوق العصري</div>
<header>
<div class="logo" id="logoBtn">السوق العصري</div>
<input id="q" placeholder="ابحث..." oninput="render()">
<button class="btn" id="addBtn" onclick="askCode()">+ منتج</button>
</header>
<div id="admin">
<select id="fc"><option>ساعات</option><option>مستلزمات أطفال</option><option>مواد غذائية</option><option>العناية بالبشرة</option><option>مستلزمات منزلية</option><option>إلكترونيات</option><option>أزياء</option><option>عطور</option><option>حقائب وأحذية</option><option>اكسسوارات موبايل</option></select>
<input id="fn" placeholder="اسم المنتج">
<input id="fd" placeholder="وصف قصير">
<input id="fp" type="number" placeholder="السعر">
<label class="pick" for="fi">📸 اختار صور (4 كحد اقصى)</label>
<input id="fi" type="file" accept="image/*" multiple style="display:none">
<div id="pvBox"></div>
<button onclick="saveProduct()" style="width:100%;background:#c9a96e;color:#fff;border:0;padding:13px;border-radius:8px;font-weight:900;margin-top:10px">نشر ✓</button>
<button onclick="document.getElementById('admin').style.display='none'" style="width:100%;background:#eee;border:0;padding:9px;border-radius:8px;margin-top:6px">اغلاق</button>
</div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div style="height:90px"></div>
<div id="cart"><div>🛒 <span id="cnt">0</span> | <span id="tot">0</span> د.ع</div><button class="wa-btn" onclick="orderNow()"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:28px"></button></div>
<div id="lightbox" onclick="this.classList.remove('show')"><img id="lightImg"><div id="lightThumbs"></div></div>
<script>
const SECRET="2223"; const WA_NUMBER="9647822642223";
let CATS=[{n:"الكل",img:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=300"},{n:"ساعات",img:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=300"},{n:"مستلزمات أطفال",img:"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=300"},{n:"مواد غذائية",img:"https://images.unsplash.com/photo-1542838132-92c53300491e?w=300"},{n:"العناية بالبشرة",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=300"},{n:"مستلزمات منزلية",img:"https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?w=300"},{n:"إلكترونيات",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300"},{n:"أزياء",img:"https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=300"},{n:"عطور",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=300"},{n:"حقائب وأحذية",img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=300"},{n:"اكسسوارات موبايل",img:"https://images.unsplash.com/photo-1585060544812-6b45742d762f?w=300"}];
let custom=[],active="الكل",cart=[],sum=0,tmpImgs=[],lastList=[];
try{custom=JSON.parse(localStorage.getItem('hasry_final_v2')||'[]')}catch(e){custom=[]}
custom=custom.map(x=>{if(x.img&&!x.imgs)x.imgs=[x.img];return x;});
let logoBtn=document.getElementById('logoBtn'),addBtn=document.getElementById('addBtn'),clickCount=0,clickTimer=null;
logoBtn.addEventListener('click',()=>{clickCount++;clearTimeout(clickTimer);clickTimer=setTimeout(()=>{clickCount=0},2000);if(clickCount>=5){clickCount=0;askCode();}});
if(window.location.search.includes('admin='+SECRET)) addBtn.classList.add('show');
function askCode(){let c=prompt("رمز الامان:");if(c===SECRET){addBtn.classList.add('show');document.getElementById('admin').style.display='block';}}
let catsEl=document.getElementById('cats');
CATS.forEach(o=>{let d=document.createElement('div');d.className='cat'+(o.n===active?' active':'');d.innerHTML='<img src="'+o.img+'"><span>'+o.n+'</span>';d.onclick=()=>{active=o.n;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));d.classList.add('active');render();};catsEl.appendChild(d);});
document.getElementById('fi').addEventListener('change',e=>{
 tmpImgs=[];let files=Array.from(e.target.files).slice(0,4);let box=document.getElementById('pvBox');box.innerHTML='';
 files.forEach(f=>{
  let r=new FileReader();
  r.onload=ev=>{
   let img=new Image();
   img.onload=()=>{
    let c=document.createElement('canvas');let max=800;let w=img.width,h=img.height;
    if(w>h){if(w>max){h*=max/w;w=max}}else{if(h>max){w*=max/h;h=max}}
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let data=c.toDataURL('image/jpeg',0.7);
    tmpImgs.push(data);
    let th=document.createElement('img');th.src=data;th.style.width='60px';th.style.height='60px';th.style.objectFit='cover';th.style.borderRadius='8px';th.style.border='1px solid #c9a96e';box.appendChild(th);
   };img.src=ev.target.result;
  };r.readAsDataURL(f);
 });
});
function getAll(){return [...custom];}
function render(){
 let list=getAll();
 if(active!=="الكل") list=list.filter(x=>x.c===active);
 let q=document.getElementById('q').value.trim(); if(q) list=list.filter(x=>x.n.includes(q));
 lastList=list;
 document.getElementById('grid').innerHTML=list.map((p,i)=>{
  let first=p.imgs?p.imgs[0]:p.img; let cnt=p.imgs?p.imgs.length:1;
  return '<div class="card"><div class="ph" onclick="openLight('+i+')"><img src="'+first+'"><div style="position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px">'+cnt+' صور</div></div><div class="info"><h4>'+p.n+'</h4><div style="font-size:10px;color:#777">'+(p.short||'')+'</div><b>'+p.p.toLocaleString()+' د.ع</b><button onclick="addToCart('+p.p+',\''+p.n.replace(/'/g,'')+'\')">أضف للسلة</button></div></div>';
 }).join('');
}
function saveProduct(){
 let c=document.getElementById('fc').value,n=document.getElementById('fn').value.trim(),d=document.getElementById('fd').value.trim(),p=parseInt(document.getElementById('fp').value);
 if(!n||!p) return alert('اكتب الاسم والسعر'); if(!tmpImgs.length) return alert('اختار صورة');
 custom.push({c,n,p,short:d,imgs:tmpImgs,img:tmpImgs[0]});
 localStorage.setItem('hasry_final_v2',JSON.stringify(custom));
 render(); alert('تم النشر ✓'); document.getElementById('admin').style.display='none';
 document.getElementById('fn').value='';document.getElementById('fp').value='';document.getElementById('fd').value='';tmpImgs=[];document.getElementById('pvBox').innerHTML='';
}
function addToCart(p,n){cart.push({n,p});sum+=p;document.getElementById('cnt').innerText=cart.length;document.getElementById('tot').innerText=sum.toLocaleString();}
function orderNow(){if(!cart.length) return alert('السلة فارغة');let t=cart.map(x=>x.n+' - '+x.p+' د.ع').join('%0A');let msg='طلب جديد:%0A'+t+'%0Aالمجموع: '+sum.toLocaleString();window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
function openLight(i){
 let p=lastList[i]; if(!p) return; let imgs=p.imgs||[p.img];
 let lb=document.getElementById('lightbox'),li=document.getElementById('lightImg'),th=document.getElementById('lightThumbs');
 li.src=imgs[0]; lb.classList.add('show'); th.innerHTML='';
 imgs.forEach((s,idx)=>{let im=document.createElement('img');im.src=s;if(idx==0) im.classList.add('active');im.onclick=(e)=>{e.stopPropagation();li.src=s;th.querySelectorAll('img').forEach(x=>x.classList.remove('active'));im.classList.add('active');};th.appendChild(im);});
}
render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
 <footer class="bg-zinc-900 mt-10 p-6 rounded-t-3xl border-t border-yellow-400/20">
  <div class="max-w-4xl mx-auto grid md:grid-cols-2 gap-6">

      <h2 class="text-xl font-bold text-yellow-400 mb-3">من نحن - العصري</h2>
      <p class="text-zinc-300 leading-7">السوق العصري متجر عراقي عصري يوفر احدث المنتجات بجودة عالية واسعار مناسبة مع توصيل لكل العراق.</p>
    </div>
    <div>
      <h2 class="text-xl font-bold text-yellow-400 mb-3">اتصل بنا</h2>
      <a href="https://wa.me/9647822642223" target="_blank" class="bg-[#25D366] p-3 rounded-xl flex items-center justify-center gap-2 font-bold text-white shadow-lg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="w-7 h-7 bg-white rounded-full p-1" alt="WhatsApp">
        تواصل واتساب - 07822642223
      </a>
    </div>
  </div>
  <p class="text-center text-zinc-600 mt-6 text-sm">جميع الحقوق محفوظة © العصري 2025</p>
 </footer>
</body>
  </html>
