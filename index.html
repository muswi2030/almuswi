<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق العصري</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma;background:#f7f7f7}
header{display:flex;gap:10px;align-items:center;padding:12px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.logo{font-weight:900;color:#c9a96e;font-size:18px;white-space:nowrap}
#q{flex:1;padding:12px 18px;border:1.5px solid #e8dcc6;border-radius:25px;outline:none}
.btn{display:none;background:#c9a96e;color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:900}
.btn.show{display:block}
#admin{display:none;background:#fff;padding:14px;margin:12px;border:2px solid #c9a96e;border-radius:14px}
#admin input,#admin select{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
.pick{background:#111;color:#c9a96e;padding:12px;border-radius:8px;text-align:center;display:block;font-weight:900;border:2px dashed #c9a96e;cursor:pointer}
#pvBox{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cats{display:flex;gap:10px;padding:12px;overflow-x:auto}
.cat-pill{background:#fff;border:1.5px solid #eee;padding:8px 16px;border-radius:20px;white-space:nowrap;font-size:13px;font-weight:700;cursor:pointer}
.cat-pill.active{background:#111;color:#fff;border-color:#111}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border-radius:16px;overflow:hidden;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.ph{height:180px;background:#f6f3ef;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:10px}
.info h4{margin:5px 0;font-size:13px;line-height:1.4;height:36px;overflow:hidden}
.info.desc{font-size:11px;color:#777;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:4px}
.info b{color:#c9a96e;display:block;font-size:16px;margin:6px 0}
.info button{width:95%;border:0;padding:10px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:4px}
.btn-add{background:#111;color:#fff}
.btn-edit{background:#f0e6d3;color:#111}
.btn-del{background:#ff3b3b;color:#fff}
#cart{position:fixed;bottom:14px;left:14px;right:14px;background:#111;color:#fff;padding:10px 16px;border-radius:50px;display:flex;justify-content:space-between;align-items:center;z-index:99}
.wa-btn{background:#fff;border:0;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center}
#lightbox.show{display:flex}
</style>
</head>
<body>
<header>
<button class="btn" id="addBtn">+ منتج</button>
<input id="q" placeholder="ابحث..." oninput="render()">
<div class="logo" id="logoBtn">السوق<br>العصري</div>
</header>

<div id="admin">
<select id="fc"><option>ساعات</option><option>مستلزمات أطفال</option><option>مواد غذائية</option><option>العناية بالبشرة</option><option>مستلزمات منزلية</option><option>إلكترونيات</option><option>أزياء</option><option>عطور</option><option>حقائب وأحذية</option><option>اكسسوارات موبايل</option></select>
<input id="fn" placeholder="اسم المنتج"><input id="fd" placeholder="الوصف"><input id="fp" type="number" placeholder="السعر">
<label class="pick" for="fi">📸 اختار صور (4 كحد اقصى)</label><input id="fi" type="file" accept="image/*" multiple style="display:none"><div id="pvBox"></div>
<button onclick="saveProduct()" id="saveBtn" style="width:100%;background:#c9a96e;color:#fff;border:0;padding:13px;border-radius:8px;font-weight:900;margin-top:10px">نشر ✓</button>
<button onclick="closeAdmin()" style="width:100%;background:#eee;border:0;padding:9px;border-radius:8px;margin-top:6px">اغلاق</button>
</div>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div style="height:120px"></div>

<div id="cart"><button class="wa-btn" onclick="orderNow()"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:28px"></button><div>🛒 <span id="cnt">0</span> | <span id="tot">0</span> د.ع</div></div>
<div id="lightbox" onclick="this.classList.remove('show')"><img id="lightImg" style="max-width:92%;max-height:80%;border-radius:14px"></div>

<script>
const SECRET="2223"; const WA_NUMBER="9647822642223";
let CATS=["الكل","ساعات","مستلزمات أطفال","مواد غذائية","العناية بالبشرة","مستلزمات منزلية","إلكترونيات","أزياء","عطور","حقائب وأحذية","اكسسوارات موبايل"];
let custom=[],active="الكل",cart=[],sum=0,tmpImgs=[],lastList=[],editingIndex=-1;
try{custom=JSON.parse(localStorage.getItem('hasry_final_v2')||'[]')}catch(e){custom=[]}

const logoBtn=document.getElementById('logoBtn'),addBtn=document.getElementById('addBtn');
let clickCount=0; logoBtn.addEventListener('click',()=>{clickCount++;setTimeout(()=>clickCount=0,2000);if(clickCount>=5)askCode();});
addBtn.addEventListener('click',()=>askCode());
if(location.search.includes('admin='+SECRET)) addBtn.classList.add('show');
function askCode(){let c=prompt("رمز الامان:");if(c===SECRET){addBtn.classList.add('show');document.getElementById('admin').style.display='block';render();}}
function closeAdmin(){document.getElementById('admin').style.display='none';editingIndex=-1;document.getElementById('saveBtn').innerText='نشر ✓';document.getElementById('fn').value='';document.getElementById('fd').value='';document.getElementById('fp').value='';tmpImgs=[];document.getElementById('pvBox').innerHTML='';}

let catsEl=document.getElementById('cats');
CATS.forEach(n=>{let d=document.createElement('div');d.className='cat-pill'+(n===active?' active':'');d.innerText=n;d.onclick=()=>{active=n;document.querySelectorAll('.cat-pill').forEach(x=>x.classList.remove('active'));d.classList.add('active');render();};catsEl.appendChild(d);});

document.getElementById('fi').addEventListener('change',e=>{
  tmpImgs=[];let files=Array.from(e.target.files).slice(0,4);let box=document.getElementById('pvBox');box.innerHTML='';
  files.forEach(f=>{let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let max=800;let w=img.width,h=img.height;if(w>h){if(w>max){h*=max/w;w=max}}else{if(h>max){w*=max/h;h=max}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let data=c.toDataURL('image/jpeg',0.7);tmpImgs.push(data);let th=document.createElement('img');th.src=data;th.style.width='60px';th.style.height='60px';th.style.objectFit='cover';th.style.borderRadius='8px';th.style.border='1px solid #c9a96e';box.appendChild(th);};img.src=ev.target.result;};r.readAsDataURL(f);});
});

function render(){
  let list=[...custom];
  if(active!=="الكل") list=list.filter(x=>x.c===active);
  let q=document.getElementById('q').value.trim(); if(q) list=list.filter(x=>x.n.includes(q));
  lastList=list;
  let isAdmin=addBtn.classList.contains('show');
  document.getElementById('grid').innerHTML=list.map((p,i)=>{
    let first=p.imgs?p.imgs[0]:p.img; let real=custom.indexOf(p);
    return `<div class="card"><div class="ph" onclick="openLight(${i})"><img src="${first}"></div><div class="info"><h4>${p.n}</h4><div class="desc">${p.short||''}</div><b>${p.p.toLocaleString()} د.ع</b><button class="btn-add" onclick="addToCart(${p.p},'${p.n.replace(/'/g,'')}')">أضف للسلة</button>${isAdmin?`<button class="btn-edit" onclick="editProduct(${real})">تعديل ✏️</button><button class="btn-del" onclick="deleteProduct(${real})">حذف ✕</button>`:''}</div></div>`;
  }).join('');
}
function saveProduct(){
  let c=document.getElementById('fc').value,n=document.getElementById('fn').value.trim(),d=document.getElementById('fd').value.trim(),p=parseInt(document.getElementById('fp').value);
  if(!n||!p) return alert('اكتب الاسم والسعر'); if(editingIndex==-1&&!tmpImgs.length) return alert('اختار صورة');
  if(editingIndex>=0){custom[editingIndex].c=c;custom[editingIndex].n=n;custom[editingIndex].short=d;custom[editingIndex].p=p; if(tmpImgs.length){custom[editingIndex].imgs=tmpImgs;custom[editingIndex].img=tmpImgs[0];}}
  else custom.push({c,n,p,short:d,imgs:tmpImgs,img:tmpImgs[0]});
  localStorage.setItem('hasry_final_v2',JSON.stringify(custom)); render(); alert(editingIndex>=0?'تم التعديل ✓':'تم النشر ✓'); closeAdmin();
}
function deleteProduct(idx){if(!confirm('تحذف '+custom[idx].n+' ؟'))return;custom.splice(idx,1);localStorage.setItem('hasry_final_v2',JSON.stringify(custom));render();}
function editProduct(idx){let p=custom[idx];editingIndex=idx;document.getElementById('fc').value=p.c;document.getElementById('fn').value=p.n;document.getElementById('fd').value=p.short||'';document.getElementById('fp').value=p.p;document.getElementById('admin').style.display='block';document.getElementById('saveBtn').innerText='حفظ التعديل ✓';window.scrollTo(0,0);}
function addToCart(p,n){cart.push({n,p});sum+=p;document.getElementById('cnt').innerText=cart.length;document.getElementById('tot').innerText=sum.toLocaleString();}
function orderNow(){if(!cart.length)return alert('السلة فارغة');let t=cart.map(x=>x.n+' - '+x.p).join('%0A');window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent('طلب جديد:\n'+t+'\nالمجموع: '+sum),'_blank');}
function openLight(i){let p=lastList[i];document.getElementById('lightImg').src=(p.imgs||[p.img])[0];document.getElementById('lightbox').classList.add('show');}
render();
</script>
</body>
</html>
