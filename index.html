<title>السوق الحصري</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#fff}
.top{background:#111;color:#c9a96e;text-align:center;padding:8px;font-size:12px;font-weight:900}
header{padding:12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:20}
.logo{color:#c9a96e;font-weight:900;font-size:20px}
#q{flex:1;padding:11px;border:1px solid #ddd;border-radius:22px}
.btn-add{background:#c9a96e;color:#fff;border:0;padding:11px 14px;border-radius:10px;font-weight:900;cursor:pointer}
#admin{display:none;background:#fffbe6;padding:14px;margin:12px;border:2px solid #c9a96e;border-radius:14px}
#admin input,#admin select{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
.pick{background:#111;color:#c9a96e;padding:12px;border-radius:8px;text-align:center;display:block;cursor:pointer;font-weight:900;border:2px dashed #c9a96e}
#pv{display:none;width:100%;height:180px;border-radius:10px;margin-top:8px;object-fit:cover}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.cat{background:#faf7f2;border:2px solid #e8dcc6;border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.cat.active{background:#111;color:#c9a96e;border-color:#111}
.cat b{font-size:26px;display:block}.cat span{font-size:10px;font-weight:800;display:block;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{border:1px solid #eee;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.ph{height:130px;background:#f6f3ef;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:8px;text-align:center}
.info h4{margin:4px 0;font-size:12px;height:30px;overflow:hidden}
.info b{color:#c9a96e;display:block;margin:4px 0}
.info button{width:100%;background:#111;color:#fff;border:0;padding:8px;border-radius:8px;cursor:pointer;font-weight:800}
#cart{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:#fff;padding:12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;z-index:99}
#cart button{background:#25D366;color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="top">السوق الحصري - AL-HASRY STORE</div>
<header>
<div class="logo">السوق الحصري</div>
<input id="q" placeholder="ابحث..." oninput="render()">
<button class="btn-add" onclick="askCode()">+ منتج</button>
</header>

<div id="admin">
<h3 style="margin:0 0 10px">اضافة منتج جديد - السوق الحصري</h3>
<select id="fc">
<option>ساعات</option><option>مستلزمات أطفال</option><option>مواد غذائية</option><option>العناية بالبشرة</option><option>مستلزمات منزلية</option><option>إلكترونيات</option><option>أزياء</option><option>عطور</option><option>حقائب وأحذية</option><option>اكسسوارات موبايل</option>
</select>
<input id="fn" placeholder="اسم المنتج بالعربي">
<input id="fp" type="number" placeholder="السعر بالدينار العراقي">
<label class="pick" for="fi">📸 اضغط لاضافة صورة المنتج</label>
<input id="fi" type="file" accept="image/*" style="display:none">
<img id="pv">
<button onclick="save()" style="width:100%;background:#c9a96e;color:#fff;border:0;padding:12px;border-radius:8px;font-weight:900;margin-top:10px;cursor:pointer">نشر المنتج ✓</button>
<button onclick="closeAdmin()" style="width:100%;background:#eee;border:0;padding:8px;border-radius:8px;margin-top:6px">اغلاق</button>
</div>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div style="height:90px"></div>

<div id="cart">
<div>🛒 <span id="cnt">0</span> | <span id="tot">0</span> د.ع</div>
<button onclick="order()">واتساب: 07822642223</button>
</div>
